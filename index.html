:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#345044 0%,#1a302e 48%,#122324 100%);color:#f7efd9;min-height:100vh}header{text-align:center;padding:22px 12px 6px}h1{font-family:Georgia,serif;font-size:clamp(2rem,5vw,3.2rem);letter-spacing:.05em;color:#f5dca1;margin:0;text-shadow:0 3px #5c3d2c}.subtitle{color:#c9d6bf;font-size:.9rem;margin:6px 0}main{max-width:850px;margin:0 auto;padding:0 14px 28px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px auto;max-width:750px;font-weight:700}.chip{font-size:.8rem;color:#f4e5bc;background:#38554b;padding:6px 11px;border-radius:999px}.game-frame{margin:auto;background:#293b38;border:6px solid #9c8053;outline:3px solid #443c2e;box-shadow:0 18px 40px #08141288;max-width:max-content;overflow:auto}canvas{display:block;width:auto;max-width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;object-fit:contain;min-width:0}#notice{text-align:center;color:#e5d6a6;min-height:1.6em;margin:15px 0 7px}.controls{text-align:center}.pad{display:grid;grid-template-columns:repeat(3,55px);grid-template-rows:repeat(2,46px);gap:5px;justify-content:center;margin:8px auto}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}button{border:1px solid #ebd09a;background:#b98b4e;color:#172623;font-weight:800;border-radius:7px;padding:10px 16px;cursor:pointer;box-shadow:0 3px #5c4c31}button:hover{background:#d9ad67}button:active{transform:translateY(2px);box-shadow:0 1px #5c4c31}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:13px}details{margin:18px auto 0;max-width:520px;border-top:1px solid #55716b;padding-top:12px;color:#bdcbc4;font-size:.85rem}summary{cursor:pointer;text-align:center}#info{text-align:center}footer{text
